<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:dark}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}</style><title>Mənim CRM</title>

<style>
/* Layout: sol menyu (masaüstü) / alt menyu (telefon); mərkəzdə iş sahəsi. Ton: soyuq slate neytrallar + göy vurğu, hər layihənin öz rəngi. */
:root{
  --bg:#0b0e17; --surface:#121726; --surface2:#171d30; --fg:#e6e9f5; --muted:#8e98b5; --line:#232a42;
  --accent:#5ee7ff; --accent-fg:#06121a; --accent-soft:rgba(94,231,255,.13);
  --good:#4df0a8; --bad:#ff7a93; --warn:#ffc766; --good-soft:rgba(77,240,168,.13); --bad-soft:rgba(255,122,147,.14); --warn-soft:rgba(255,199,102,.14);
  --glow:rgba(94,231,255,.35); --shadow:0 0 0 1px rgba(255,255,255,.02),0 8px 24px rgba(0,0,0,.35);
  --bg-a:rgba(94,231,255,.07); --bg-b:rgba(167,139,250,.08);
  --f-display:'Space Grotesk','Inter',system-ui,sans-serif; --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; color-scheme:dark}
:root[data-theme="light"]{
  --bg:#eef1fb; --surface:#ffffff; --surface2:#f4f6fd; --fg:#161a2e; --muted:#5f6a8a; --line:#dde2f3;
  --accent:#5a3df0; --accent-fg:#ffffff; --accent-soft:rgba(90,61,240,.10);
  --good:#0b8f60; --bad:#d6335a; --warn:#a96a00; --good-soft:rgba(11,143,96,.12); --bad-soft:rgba(214,51,90,.10); --warn-soft:rgba(169,106,0,.12);
  --glow:rgba(90,61,240,.28); --shadow:0 1px 2px rgba(30,40,90,.06),0 6px 20px rgba(30,40,90,.06);
  --bg-a:rgba(90,61,240,.06); --bg-b:rgba(0,180,220,.06);
  color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--bg);background-image:radial-gradient(900px 500px at 85% -10%,var(--bg-a),transparent 60%),radial-gradient(700px 500px at -10% 40%,var(--bg-b),transparent 60%);background-attachment:fixed;color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px} .right{text-align:right}
.good{color:var(--good)} .bad{color:var(--bad)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0;max-width:980px;margin:0 auto}
.hdr h1{font-size:20px;flex:1;min-width:0}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--good);border-color:var(--good)} .pill.err{color:var(--bad);border-color:var(--bad)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;line-height:1}
main{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-bottom:24px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px;border-radius:10px;font-size:12px;color:var(--muted);font-weight:500}
nav.tabs button.on{color:var(--accent);background:var(--accent-soft)}
@media(min-width:900px){
  body{padding-left:calc(200px + 24px);padding-block:0 40px}
  .hdr,main{margin-left:0}
  nav.tabs{top:0;right:auto;bottom:0;width:184px;flex-direction:column;gap:4px;border-top:0;border-right:1px solid var(--line);padding:calc(70px + env(safe-area-inset-top,0px)) 12px 12px}
  nav.tabs button{flex:none;text-align:left;padding:10px 12px;font-size:14px}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:20px;margin-top:2px}
.stat span{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],input[type=url],select,textarea{
  width:100%;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
textarea{resize:vertical;line-height:1.5;min-height:44px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-weight:500;white-space:nowrap}
.btn.p{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.ghost{background:none}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.pc{border-left:4px solid var(--pc,var(--accent))}
.pc header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pc,var(--accent));flex:none}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--pc,var(--accent))}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);background:none;flex:none;margin-top:1px;padding:0;color:var(--accent-fg);font-size:14px;line-height:1}
.chk.on{background:var(--good);border-color:var(--good)}
.task .t{flex:1;min-width:0}
.task .t b{font-weight:500;overflow-wrap:anywhere}
.task.dn .t b{text-decoration:line-through;color:var(--muted)}
.chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);margin-right:4px}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.tact{display:flex;gap:2px;flex:none}
.tact button{border:0;background:none;color:var(--muted);padding:4px 6px;border-radius:6px}
.tact button:hover{background:var(--surface2)}
.addrow{display:flex;gap:8px;margin-top:8px}
.sub{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.sub button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;white-space:nowrap;font-size:13.5px}
.sub button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.phase{font-family:var(--f-display);font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 2px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right}
tr.zero td{color:var(--muted)}
details>summary{cursor:pointer}
.item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .d{width:78px;flex:none;color:var(--muted);font-size:12.5px;padding-top:2px}
.item .b{flex:1;min-width:0;overflow-wrap:anywhere}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}
.swatches button.on{border-color:var(--fg)}
.modalbg{position:fixed;inset:0;z-index:50;background:rgba(10,14,24,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 24px}
.modal{background:var(--surface);border-radius:16px;border:1px solid var(--line);max-width:560px;width:100%;padding:18px;display:flex;flex-direction:column;gap:14px;margin-top:20px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.sec textarea{min-height:90px}
.score{font-family:var(--f-display);font-size:22px}
svg text{fill:var(--muted);font-size:10px}
.ci{fill:var(--good)} .co{fill:var(--bad)}

.card{border-radius:16px}
.pc{border-left:0;position:relative;box-shadow:var(--shadow),inset 3px 0 0 var(--pc,var(--accent))}
.pc::after{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--pc,var(--accent));filter:blur(7px);opacity:.7;pointer-events:none}
.btn.p{box-shadow:0 0 18px -4px var(--glow);font-weight:600}
nav.tabs{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px)}
nav.tabs button.on{box-shadow:inset 0 0 0 1px var(--accent),0 0 16px -6px var(--glow)}
.sub button.on{box-shadow:0 0 16px -4px var(--glow)}
.chk.on{box-shadow:0 0 10px var(--good)}
.bar i{box-shadow:0 0 8px var(--pc,var(--accent))}
.dot{box-shadow:0 0 8px var(--pc,var(--accent))}
.stat{border-radius:14px}
.stat b{letter-spacing:-.02em}
.pill.ok{box-shadow:0 0 12px -4px var(--good)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
h2{letter-spacing:-.015em}
@media (prefers-reduced-motion:no-preference){.btn,.chk,.sub button,nav.tabs button{transition:background .15s,box-shadow .15s,border-color .15s}}
@media(max-width:899px){nav.tabs{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}nav.tabs::-webkit-scrollbar{display:none}nav.tabs button{flex:0 0 auto;padding:8px 13px;white-space:nowrap}}
</style>

<script>
(function(){
'use strict';
/* Supabase (istəyə bağlı): burada doldursanız, hər cihazda yalnız email+parol yazmaq kifayət edir. */
var CONFIG={SUPABASE_URL:'https://kwjgvycrwhnhzlfvutqg.supabase.co',SUPABASE_ANON_KEY:'sb_publishable_QV9-jkwjOI17HY7jrKbl4w_lh6FMoax'};
var EMBEDDED_SEED=null; /*SEED*/
var LS='crm_state_v1',LSC='crm_sb_cfg_v1';
var MONTHS=['Yanvar','Fevral','Mart','Aprel','May','İyun','İyul','Avqust','Sentyabr','Oktyabr','Noyabr','Dekabr'];
var DAYS=['Bazar','Bazar ertəsi','Çərşənbə axşamı','Çərşənbə','Cümə axşamı','Cümə','Şənbə'];
var COLORS=['#4d8dff','#2ee6c5','#ffb54d','#ff6b81','#a78bfa','#7dff7a','#ff5fa8','#8b9ab8'];
var STATUSES=['Planlaşdırma','İşləyir','Dayandırılıb','Tamamlanıb'];
var PRIOS={1:'Yüksək',2:'Orta',3:'Aşağı'};

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function pad(n){return (n<10?'0':'')+n}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ds(new Date())}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d)}
function diffDays(a,b){return Math.round((Date.UTC.apply(null,b.split('-').map(function(x,i){return i==1?x-1:+x}))-Date.UTC.apply(null,a.split('-').map(function(x,i){return i==1?x-1:+x})))/864e5)}
function human(s){var d=pd(s);return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()}
function short(s){var d=pd(s);return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)}
function num(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(n)?0:n}
function money(n){n=Math.round(n*100)/100;var neg=n<0;var p=Math.abs(n).toFixed(2).split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');return (neg?'−':'')+p[0]+','+p[1]+' ₼'}
function el(id){return document.getElementById(id)}

/* ---------- state ---------- */
function empty(){return {v:1,updatedAt:0,projects:[],tasks:[],logs:[],fin:[],done:[],orders:[],subs:[],courier:[],note:''}}
function norm(s){var e=empty();for(var k in e){if(s[k]===undefined)s[k]=e[k]}
  ['projects','tasks','logs','fin','done','orders','subs','courier'].forEach(function(k){if(!Array.isArray(s[k]))s[k]=[]});
  s.projects.forEach(function(p,i){p.sections=p.sections||[];p.links=p.links||[];p.tools=p.tools||[];p.sc=p.sc||{};if(p.order==null)p.order=i+1;p.status=p.status||'Planlaşdırma';p.color=p.color||COLORS[i%COLORS.length]});
  return s}
function load(){var raw=lsGet(LS);if(raw){try{return norm(JSON.parse(raw))}catch(e){}}
  if(EMBEDDED_SEED){return norm(JSON.parse(JSON.stringify(EMBEDDED_SEED)))}
  return empty()}
var S=load();
var UI={tab:'today',pid:null,ptab:'tasks',period:'30',from:'',to:'',edit:null,focus:null,archPid:'',archQ:'',archT:'',confirm:null,modal:null,msg:''};
var saveT=null;
function save(){S.updatedAt=Date.now();lsSet(LS,JSON.stringify(S));schedulePush()}
function saveQuiet(){clearTimeout(saveT);saveT=setTimeout(save,500)}

/* ---------- data helpers ---------- */
function P(id){return S.projects.filter(function(p){return p.id===id})[0]}
function sortedProjects(all){return S.projects.filter(function(p){return all||(!p.archived&&(p.status==='Planlaşdırma'||p.status==='İşləyir'))}).sort(function(a,b){return a.order-b.order})}
function tasksOf(pid){return S.tasks.filter(function(t){return t.pid===pid}).sort(function(a,b){return a.order-b.order})}
function isDone(t){return t.repeat?t.doneOn===today():!!t.done}
function pname(pid){var p=P(pid);return p?p.name:'—'}
function pcolor(pid){var p=P(pid);return p?p.color:'#64748b'}
function inRange(d,f,t){return d>=f&&d<=t}
function finSum(f,t,pid){var i=0,o=0;S.fin.forEach(function(e){if(pid&&e.pid!==pid)return;if(!inRange(e.date,f,t))return;if(e.type==='in')i+=e.amount;else o+=e.amount});return {i:i,o:o}}
function toolCost(p,f,t){var c=0;p.tools.forEach(function(x){var st=x.since||today();var s=st>f?st:f;var en=x.active?t:(x.until||t);if(en>t)en=t;if(en<s)return;c+=x.cost*12/365*(diffDays(s,en)+1)});return c}
function toolCostAll(f,t,pid){var c=0;S.projects.forEach(function(p){if(!pid||p.id===pid)c+=toolCost(p,f,t)});return c}
function minDate(){var m=today();S.fin.forEach(function(e){if(e.date<m)m=e.date});S.projects.forEach(function(p){p.tools.forEach(function(x){if(x.since&&x.since<m)m=x.since})});return m}
function period(){var t=today(),p=UI.period;
  if(p==='today')return [t,t];if(p==='7')return [addDays(t,-6),t];if(p==='30')return [addDays(t,-29),t];
  if(p==='month')return [t.slice(0,8)+'01',t];if(p==='custom')return [UI.from||t,UI.to||t];return [minDate(),t]}
function costScore(b){if(b===''||b==null||isNaN(+b))return 3;b=+b;return b<=100?5:b<=300?4:b<=1000?3:b<=3000?2:1}
function score(p){var s=p.sc||{};var pot=+s.pot||3,sp=+s.spd||3,rk=+s.rsk||3,h=+s.rdy||0;return Math.round((3*pot+2*sp+2*(6-rk)+2*costScore(s.bud)+h/20)*2)}
function progress(pid){var ts=tasksOf(pid).filter(function(t){return !t.repeat});var d=ts.filter(function(t){return t.done}).length;return {d:d,n:ts.length}}
function minutes(pid){var m=0;S.logs.forEach(function(l){if(!pid||l.pid===pid)m+=l.min||0});return m}

/* ---------- actions ---------- */
function addTask(pid,title,o){title=(title||'').trim();if(!title)return;o=o||{};
  var mx=0;tasksOf(pid).forEach(function(t){if(t.order>mx)mx=t.order});
  S.tasks.push({id:uid(),pid:pid,title:title,note:o.note||'',phase:o.phase||'',prio:o.prio||2,due:o.due||'',repeat:o.repeat||'',done:false,doneOn:'',mine:true,order:mx+1,ts:Date.now()});save()}
function toggleTask(id){var t=S.tasks.filter(function(x){return x.id===id})[0];if(!t)return;var td=today();
  if(t.repeat){if(t.doneOn===td){t.doneOn='';rmDone(id,td)}else{t.doneOn=td;S.done.push({id:uid(),date:td,pid:t.pid,taskId:id,title:t.title,ts:Date.now()})}}
  else if(t.done){t.done=false;t.doneAt='';rmDone(id,null)}
  else{t.done=true;t.doneAt=td;S.done.push({id:uid(),date:td,pid:t.pid,taskId:id,title:t.title,ts:Date.now()})}
  save()}
function rmDone(taskId,date){for(var i=S.done.length-1;i>=0;i--){if(S.done[i].taskId===taskId&&(!date||S.done[i].date===date)){S.done.splice(i,1);break}}}
function moveTask(id,dir){var t=S.tasks.filter(function(x){return x.id===id})[0];var l=tasksOf(t.pid);var i=l.indexOf(t);var j=i+dir;if(j<0||j>=l.length)return;var a=l[i].order;l[i].order=l[j].order;l[j].order=a;save()}
function addLog(pid,text,min){text=(text||'').trim();if(!text)return;S.logs.push({id:uid(),date:today(),pid:pid,text:text,min:Math.round(num(min)),ts:Date.now()});save()}
function addFin(pid,type,amount,note,date){amount=num(amount);if(!(amount>0))return false;S.fin.push({id:uid(),date:date||today(),pid:pid,type:type,amount:amount,note:(note||'').trim(),ts:Date.now()});save();return true}
function newProject(){var n=S.projects.length;var p={id:uid(),name:'Yeni layihə',type:'',status:'Planlaşdırma',color:COLORS[n%COLORS.length],summary:'',start:today(),order:n+1,sc:{pot:3,spd:3,rsk:3,bud:'',rdy:0},sections:[],links:[],tools:[],archived:false};S.projects.push(p);save();UI.pid=p.id;UI.tab='projects';UI.ptab='notes'}
function ask(key){if(UI.confirm===key){UI.confirm=null;return true}UI.confirm=key;return false}

/* ---------- render ---------- */
var TABS=[['today','Bu gün'],['projects','Layihələr'],['finance','Maliyyə'],['orders','Sifarişlər'],['subs','Abunəliklər'],['courier','Kuryerlik'],['study','Dərslər'],['strategy','Strategiya'],['archive','Arxiv']];
function render(){
  var sy=window.scrollY;var app=el('app');
  if(LOCK){app.innerHTML='<div class="card" style="max-width:320px;margin:20vh auto"><h2>🔒 Mənim CRM</h2><input type="password" id="pin-i" inputmode="numeric" data-enter="unlock" placeholder="PIN" style="margin-top:10px">'+(UI.pinErr?'<p class="small bad">Yanlış PIN</p>':'')+'<div class="row" style="margin-top:10px"><button class="btn p" data-act="unlock">Aç</button></div></div>';el('modal').hidden=true;return}
  var h='<div class="hdr"><h1>Mənim CRM</h1>'+syncPill()+'<button class="iconbtn" data-act="settings" aria-label="Ayarlar">⚙</button></div>';
  h+='<main>'+view()+'</main>';
  h+=UI.undoOn?'<div class="card" style="position:fixed;left:12px;right:12px;bottom:76px;z-index:40;display:flex;gap:10px;align-items:center"><span class="grow">Silindi.</span><button class="btn p sm" data-act="undo">Geri al</button></div>':'';

  var h='<h2 style="font-size:20px">Maliyyə</h2><div class="sub">'+per.map(function(x){return '<button data-act="period" data-v="'+x[0]+'" class="'+(UI.period===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div>';
  if(UI.period==='custom')h+='<div class="row"><input type="date" id="pf" value="'+f+'" data-act-change="pfrom"><span>–</span><input type="date" id="pt" value="'+t+'" data-act-change="pto"></div>';
  h+='<div class="small muted">'+human(f)+' – '+human(t)+'</div>';

  h+=chart(f,t);

  h+=finForm('');
  h+='<div class="card"><h2>Layihələr üzrə</h2><div class="tbl"><table><thead><tr><th>Layihə</th><th class="r">Gəlir</th><th class="r">Xərc</th><th class="r">Abunə</th><th class="r">Xalis</th></tr></thead><tbody>'+
   ps.map(function(p){var x=finSum(f,t,p.id);var c=toolCost(p,f,t);return '<tr><td><span class="dot" style="--pc:'+p.color+';display:inline-block;margin-right:6px"></span>'+esc(p.name)+'</td><td class="r num">'+money(x.i)+'</td><td class="r num">'+money(x.o)+'</td><td class="r num">'+money(c)+'</td><td class="r num"><b>'+money(x.i-x.o-c)+'</b></td></tr>'}).join('')+
   noProjRow(f,t)+'<tr><td><b>Cəmi</b></td><td class="r num"><b>'+money(tot.i)+'</b></td><td class="r num"><b>'+money(tot.o)+'</b></td><td class="r num"><b>'+money(tc)+'</b></td><td class="r num"><b>'+money(tot.i-tot.o-tc)+'</b></td></tr></tbody></table></div></div>';
  h+='<div class="card"><h2>Gündəlik cədvəl</h2><div class="small muted">Qeyd olunmayan günlər avtomatik 0 / 0 görünür.</div><div class="tbl"><table><thead><tr><th>Gün</th><th class="r">Gəlir</th><th class="r">Xərc</th><th class="r">Abunə</th><th class="r">Xalis</th></tr></thead><tbody>';
  var n=0,d=t;while(d>=f&&n<400){var x=finSum(d,d);var c=toolCostAll(d,d);var z=!x.i&&!x.o;
    h+='<tr class="'+(z?'zero':'')+'"><td>'+short(d)+' · '+DAYS[pd(d).getDay()].slice(0,3)+'</td><td class="r num">'+money(x.i)+'</td><td class="r num">'+money(x.o)+'</td><td class="r num">'+money(c)+'</td><td class="r num">'+money(x.i-x.o-c)+'</td></tr>';d=addDays(d,-1);n++}
  return h+'</tbody></table></div>'+(n>=400?'<div class="small muted">Yalnız son 400 gün göstərilir.</div>':'')+'</div>'}
function chart(f,t){var days=[];var d=t;while(d>=f&&days.length<31){days.unshift(d);d=addDays(d,-1)}
  var vals=days.map(function(x){var s=finSum(x,x);return {d:x,i:s.i,o:s.o}});var mx=0;vals.forEach(function(v){mx=Math.max(mx,v.i,v.o)});
  if(!mx)return '<div class="card"><h2>Gün-gün qrafik</h2><div class="empty">Seçilmiş dövrdə gəlir və ya xərc yoxdur.</div></div>';
  var W=640,H=150,L=44,B=18,T=8,iw=W-L-6,ih=H-B-T,bw=iw/vals.length;var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Gündəlik gəlir və xərc">';
  [0,.5,1].forEach(function(k){var y=T+ih-ih*k;s+='<line x1="'+L+'" x2="'+(W-6)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-4)+'" y="'+(y+3)+'" text-anchor="end">'+Math.round(mx*k)+'</text>'});
  vals.forEach(function(v,k){var x=L+k*bw;var hi=ih*v.i/mx,ho=ih*v.o/mx;s+='<rect class="ci" x="'+(x+bw*.1)+'" y="'+(T+ih-hi)+'" width="'+bw*.38+'" height="'+hi+'"/><rect class="co" x="'+(x+bw*.5)+'" y="'+(T+ih-ho)+'" width="'+bw*.38+'" height="'+ho+'"/>'});
  s+='<text x="'+L+'" y="'+(H-4)+'">'+short(vals[0].d)+'</text><text x="'+(W-6)+'" y="'+(H-4)+'" text-anchor="end">'+short(vals[vals.length-1].d)+'</text></svg>';
  return '<div class="card"><h2>Gün-gün qrafik</h2><div class="small muted"><span class="good">■</span> gəlir &nbsp; <span class="bad">■</span> xərc</div>'+s+'</div>'}

function subsCard(){var ps=sortedProjects(true).filter(function(p){return !p.archived});var m=0,rows='';
  S.projects.forEach(function(p){p.tools.forEach(function(x){if(x.active)m+=x.cost;rows+='<div class="item"><div class="b"><b>'+esc(x.name)+'</b> <span class="num">'+money(x.cost)+'</span>/ay <span class="small muted">· '+esc(p.name)+(x.since?' · '+short(x.since)+' tarixindən':'')+(x.active?'':' · dayandırılıb')+'</span></div><div class="tact"><button data-act="tooltog" data-id="'+p.id+'" data-t="'+x.id+'">'+(x.active?'Dayandır':'Davam et')+'</button><button data-act="tooldel" data-id="'+p.id+'" data-t="'+x.id+'">✕</button></div></div>'})});
  return '<div class="card"><h2>Abunələr və aylıq xərclər</h2><div class="small muted">Aktiv abunələr: <b class="num bad">'+money(m)+'</b>/ay. Məbləğ gündəlik bölünür və Xalis nəticədən çıxılır.</div>'+(rows||'<div class="empty">Hələ abunə yoxdur.</div>')+
  '<div class="grid g4" style="margin-top:10px"><label class="f">Ad<input type="text" id="fs-n" placeholder="Məs: Claude, Canva, domen"></label><label class="f">Layihə<select id="fs-p">'+ps.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>'}).join('')+'</select></label><label class="f">Aylıq, ₼<input type="number" id="fs-c" inputmode="decimal" step="0.01" min="0"></label><label class="f">Başlama tarixi<input type="date" id="fs-d" value="'+today()+'"></label></div><div class="row" style="margin-top:10px"><button class="btn p" data-act="subadd">Abunə əlavə et</button></div></div>'}

   rec.map(function(p,i){var x=finSum('0000-01-01','9999-12-31',p.id);var net=x.i-x.o-toolCost(p,'0000-01-01',today());var m=minutes(p.id);return '<tr><td>'+(i+1)+'</td><td><span class="dot" style="--pc:'+p.color+';display:inline-block;margin-right:6px"></span>'+esc(p.name)+'</td><td class="r num"><b>'+score(p)+'</b></td><td class="r num">'+money(x.i)+'</td><td class="r num">'+money(net)+'</td><td class="r num">'+(m/60).toFixed(1)+'</td><td class="r num">'+(m?money(net/(m/60)):'—')+'</td></tr>'}).join('')+'</tbody></table></div>'+

  h+='<div class="card"><h2>İş sırası (əl ilə)</h2><div class="small muted">“Bu gün” səhifəsində layihələr bu sıra ilə görünür.</div>';
  sortedProjects(true).filter(function(p){return !p.archived}).forEach(function(p,i,a){h+='<div class="item"><div class="d">'+(i+1)+'</div><div class="b"><span class="dot" style="--pc:'+p.color+';display:inline-block;margin-right:6px"></span>'+esc(p.name)+' <span class="chip">'+esc(p.status)+'</span></div><div class="tact"><button data-act="pup" data-id="'+p.id+'">▲</button><button data-act="pdown" data-id="'+p.id+'">▼</button></div></div>'});

  h+='<div class="card"><h2>Xronologiya ('+items.length+')</h2>'+(items.slice(0,300).map(function(i){return '<div class="item"><div class="d">'+short(i.d)+'</div><div class="b"><span class="chip '+(i.c||'')+'">'+i.k+'</span><span class="chip" style="border-color:'+pcolor(i.pid)+'">'+esc(pname(i.pid))+'</span> '+esc(i.t)+'</div></div>'}).join('')||'<div class="empty">Uyğun qeyd tapılmadı.</div>')+'</div>';

/* ---------- sync ---------- */
var sb=null,session=null,syncState='local',syncMsg='',pushT=null;
function cfg(){var c={};try{c=JSON.parse(lsGet(LSC)||'{}')}catch(e){}return {url:CONFIG.SUPABASE_URL||c.url||'',key:CONFIG.SUPABASE_ANON_KEY||c.key||''}}
function syncPill(){var m={local:['Yalnız bu cihaz',''],nologin:['Giriş edilməyib',''],ok:['Sinxron ✓','ok'],busy:['Sinxronlanır…',''],error:['Sinxron xətası','err']}[syncState];return '<span class="pill '+m[1]+'" title="'+esc(syncMsg)+'">'+m[0]+'</span>'}
function loadSb(){return new Promise(function(res,rej){if(window.supabase)return res();var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';s.onload=res;s.onerror=function(){rej(new Error('Supabase kitabxanası yüklənmədi'))};document.head.appendChild(s)})}
async function sbStart(){var c=cfg();if(!c.url||!c.key){syncState='local';return}
  try{await loadSb();sb=window.supabase.createClient(c.url,c.key);var r=await sb.auth.getSession();session=r.data.session;
    if(session){await pull()}else syncState='nologin'}catch(e){syncState='error';syncMsg=e.message}
  render();if(session&&S.apiMode&&S.autoAdvice&&(!S.advice||S.advice.date!==today()))runAdvice()}
async function pull(){if(!sb||!session)return;syncState='busy';
  var r=await sb.from('crm_state').select('data').eq('user_id',session.user.id).maybeSingle();
  if(r.error){syncState='error';syncMsg=r.error.message;return}
  if(r.data&&r.data.data){var rem=norm(r.data.data);if((rem.updatedAt||0)>(S.updatedAt||0)){S=rem;lsSet(LS,JSON.stringify(S));syncState='ok';return}}
  await push()}
async function push(){if(!sb||!session)return;syncState='busy';
  var r=await sb.from('crm_state').upsert({user_id:session.user.id,data:S,updated_at:new Date().toISOString()},{onConflict:'user_id'});
  if(r.error){syncState='error';syncMsg=r.error.message}else{syncState='ok';syncMsg=''}
  var p=document.querySelector('.pill');if(p)p.outerHTML=syncPill()}
function schedulePush(){if(!sb||!session)return;clearTimeout(pushT);pushT=setTimeout(push,1500)}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&sb&&session){pull().then(function(){if(!UI.modal&&!document.activeElement.matches('input,textarea,select'))render()})}});

var CATS=['Reklam','Material','Çatdırılma','Abunə','İcarə','Maaş/xidmət','Digər'];
var UNDO=null,LOCK=false;try{LOCK=!!lsGet('crm_pin')&&sessionStorage.getItem('crm_unl')!=='1'}catch(x){LOCK=!!lsGet('crm_pin')}
function catOpts(){return '<option value="">—</option>'+CATS.map(function(c){return '<option>'+c+'</option>'}).join('')}
function rate(c){var r=S.rates||{};return c==='USD'?(+r.USD||1.7):c==='EUR'?(+r.EUR||1.85):1}
function pinHash(p){return crypto.subtle.digest('SHA-256',new TextEncoder().encode('crm|'+p)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')})}
function applyRec(){var m=today().slice(0,7),dd=+today().slice(8),ch=false;(S.rec||[]).forEach(function(r){if(r.last!==m&&dd>=r.day){S.fin.push({id:uid(),date:m+'-'+pad(r.day),pid:r.pid,type:'out',amount:r.amount,note:r.note+' (təkrarlanan)',cat:r.cat||'',ts:Date.now()});r.last=m;ch=true}});if(ch)save()}
function tgtBar(p){var tg=num(p.target),i=finSum(today().slice(0,8)+'01',today(),p.id).i;return '<div class="small muted" style="margin-top:8px">Bu ay hədəf: '+money(i)+' / '+money(tg)+'</div><div class="bar"><i style="width:'+Math.min(100,i/tg*100)+'%"></i></div>'}
function catCard(f,t){var m={},tot=0;S.fin.forEach(function(e){if(e.type!=='out'||!inRange(e.date,f,t))return;var k=e.cat||'Kateqoriyasız';m[k]=(m[k]||0)+e.amount;tot+=e.amount});var ks=Object.keys(m).sort(function(a,b){return m[b]-m[a]});
  if(!ks.length)return '';return '<div class="card"><h2>Xərc kateqoriyaları</h2>'+ks.map(function(k){return '<div class="row small" style="margin-top:6px"><span style="width:110px">'+esc(k)+'</span><div class="bar grow"><i style="width:'+m[k]/tot*100+'%"></i></div><span class="num">'+money(m[k])+'</span></div>'}).join('')+'</div>'}
function recCard(){var ps=sortedProjects(true).filter(function(p){return !p.archived});
  var rows=(S.rec||[]).map(function(r){return '<div class="item"><div class="b"><b>'+esc(r.note)+'</b> <span class="num bad">'+money(r.amount)+'</span> hər ayın '+r.day+'-i · <span class="small muted">'+esc(pname(r.pid))+'</span></div><div class="tact"><button data-act="recdel" data-id="'+r.id+'">✕</button></div></div>'}).join('');
  return '<div class="card"><h2>Təkrarlanan xərclər</h2><div class="small muted">Hər ay seçdiyiniz gündə avtomatik xərc kimi yazılır (icarə, domen və s.).</div>'+rows+'<div class="grid g4" style="margin-top:10px"><label class="f">Ad<input type="text" id="rc-n"></label><label class="f">Layihə<select id="rc-p">'+ps.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>'}).join('')+'</select></label><label class="f">Məbləğ, ₼<input type="number" id="rc-a" step="0.01" min="0" inputmode="decimal"></label><label class="f">Gün (1–28)<input type="number" id="rc-d" min="1" max="28" value="1"></label></div><div class="row" style="margin-top:10px"><button class="btn p" data-act="recadd">Əlavə et</button></div></div>'}
function subHtml(t,full){var s=t.sub||[];var h=s.map(function(x,i){return '<div class="small" style="display:flex;gap:6px;align-items:center;padding:2px 0"><button class="chk'+(x.d?' on':'')+'" style="width:18px;height:18px;min-width:18px" data-act="subtog" data-id="'+t.id+'" data-i="'+i+'">'+(x.d?'✓':'')+'</button><span class="grow" style="'+(x.d?'text-decoration:line-through;opacity:.6':'')+'">'+esc(x.t)+'</span>'+(full?'<button data-act="subdel" data-id="'+t.id+'" data-i="'+i+'" aria-label="Sil">✕</button>':'')+'</div>'}).join('');

var OST=['Yeni','İstehsalda','Göndərildi','Çatdırıldı','Ləğv'];
function ordOf(id){return S.orders.filter(function(o){return o.id===id})[0]}
function ordPaid(o){var s=0;S.fin.forEach(function(e){if(e.oid===o.id&&e.type==='in')s+=e.amount});return s}
function ordOpen(o){return o.status!=='Çatdırıldı'&&o.status!=='Ləğv'}
function ordRest(o){return o.status==='Ləğv'?0:Math.max(0,o.price-ordPaid(o))}
function waLink(p){var d=String(p||'').replace(/\D/g,'');if(!d)return '';if(d.charAt(0)==='0')d='994'+d.slice(1);else if(d.length===9)d='994'+d;return 'https://wa.me/'+d}

  if(!c.url||!c.key){h+='<p class="muted small">Telefon və kompüterdə eyni məlumatı görmək üçün Supabase layihəsinin ünvanını və anon açarını yazın.</p><label class="f">Project URL<input type="url" id="sb-url" placeholder="https://xxxx.supabase.co"></label><label class="f" style="margin-top:6px">anon public key<input type="text" id="sb-key"></label><div class="row" style="margin-top:8px"><button class="btn p" data-act="sbsave">Saxla</button></div>'}
  else if(!session){h+='<label class="f">Email<input type="email" id="sb-mail" autocomplete="username"></label><label class="f" style="margin-top:6px">Parol<input type="password" id="sb-pass" autocomplete="current-password"></label><div class="row" style="margin-top:8px"><button class="btn p" data-act="sblogin">Giriş</button><button class="btn" data-act="sbsignup">Hesab yarat</button><button class="btn ghost" data-act="sbreset">Ayarı sil</button></div>'}
  else{h+='<p class="small">Daxil olunub: <b>'+esc(session.user.email)+'</b></p><div class="row"><button class="btn p" data-act="sbsync">İndi sinxronla</button><button class="btn" data-act="sblogout">Çıxış</button></div>'}
  if(UI.msg)h+='<p class="small bad">'+esc(UI.msg)+'</p>';
  h+='</div><div><h3 style="font-size:15px">Görünüş və təhlükəsizlik</h3><div class="row" style="margin-top:6px"><button class="btn" data-act="theme">Açıq / tünd rejim</button></div><div class="row" style="margin-top:8px"><input type="password" id="pin-n" inputmode="numeric" placeholder="Yeni PIN (4–8 rəqəm)" style="max-width:190px"><button class="btn" data-act="setpin">PIN qur</button><button class="btn ghost" data-act="rmpin">PIN sil</button></div><p class="small muted">PIN yalnız bu cihazda səhifəni kilidləyir. Əsas qoruma Supabase girişidir.</p><h3 style="font-size:15px;margin-top:12px">Valyuta məzənnəsi (1 vahid = ? ₼)</h3><div class="row"><input type="number" id="rt-usd" step="0.01" value="'+rate('USD')+'" style="max-width:90px"> USD <input type="number" id="rt-eur" step="0.01" value="'+rate('EUR')+'" style="max-width:90px"> EUR <button class="btn" data-act="saverates">Saxla</button></div></div><div><h3 style="font-size:15px">Claude köməkçi</h3><div class="row" style="margin-top:6px"><button class="btn" data-act="claudetog">Claude bölməsi: '+(S.claudeOn?'AÇIQ':'bağlı')+'</button><button class="btn" data-act="apitog">API rejimi: '+(S.apiMode?'AÇIQ':'bağlı')+'</button><button class="btn" data-act="autotog">Gündəlik avtomatik məsləhət: '+(S.autoAdvice?'AÇIQ':'bağlı')+'</button></div><p class="small muted">Açıq olanda hər gün CRM-i ilk açanda Claude məsləhət yazır.</p></div><div><h3 style="font-size:15px">Ehtiyat nüsxə</h3><div class="row" style="margin-top:6px"><button class="btn" data-act="report">Claude üçün hesabat</button><button class="btn" data-act="export">Faylı yüklə</button><button class="btn" data-act="csv">Maliyyə (CSV)</button><button class="btn" data-act="copyjson">Kopyala</button><label class="btn" style="cursor:pointer">Fayldan bərpa et<input type="file" accept=".json,application/json" data-file="import" hidden></label></div><p class="small muted">Bərpa cari məlumatı əvəz edir.</p></div></div></div>';
  return h}

/* ---------- events ---------- */
function val(id){var e=el(id);return e?e.value:''}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='closemodal'&&e.target.closest('[data-stop]')&&!e.target.closest('button'))return;
  act(t.dataset.act,t,e)});
document.addEventListener('keydown',function(e){if(e.key!=='Enter')return;var t=e.target;if(t.matches&&t.matches('input[data-enter]')){e.preventDefault();act(t.dataset.enter,t,e)}});
document.addEventListener('input',function(e){var t=e.target;if(t.classList&&t.classList.contains('auto'))autosize(t);
  if(t.id==='ar-q'){UI.archQ=t.value;UI.focus='ar-q';render();var q=el('ar-q');if(q)q.setSelectionRange(q.value.length,q.value.length);return}
  if(t.dataset&&t.dataset.bind&&(t.tagName==='TEXTAREA'||t.type==='text')){bind(t);saveQuiet()}});
document.addEventListener('change',function(e){var t=e.target;
  if(t.dataset&&t.dataset.up){upFile(t);return}
  if(t.dataset&&t.dataset.file){readFile(t.files[0]);return}
  if(t.dataset&&t.dataset.bind&&!(t.tagName==='TEXTAREA'||t.type==='text')){bind(t);save();render();return}
  var a=t.dataset&&t.dataset.actChange;if(a){if(a==='pfrom')UI.from=t.value;if(a==='pto')UI.to=t.value;if(a==='archp')UI.archPid=t.value;if(a==='archt')UI.archT=t.value;render()}});
function bind(t){var p=t.dataset.bind.split('|');var v=t.value;
  if(p[0]==='note'){S.note=v}
  else if(p[0]==='ord'){var od=ordOf(p[1]);if(od)od[p[2]]=(p[2]==='price')?num(v):v}
  else if(p[0]==='proj'){var pr=P(p[1]);if(pr)pr[p[2]]=v}
  else if(p[0]==='sec'){var pr2=P(p[1]);if(pr2&&pr2.sections[+p[2]])pr2.sections[+p[2]][p[3]]=v}
  else if(p[0]==='sc'){var pr3=P(p[1]);if(pr3)pr3.sc[p[2]]=(p[2]==='bud'&&v==='')?'':num(v)}}
function readFile(f){if(!f)return;var r=new FileReader();r.onload=function(){try{var d=norm(JSON.parse(r.result));if(!d.projects.length&&!d.tasks.length)throw new Error('boş');S=d;if(!S.updatedAt)S.updatedAt=1;save();UI.modal=false;UI.tab='today';UI.pid=null;render()}catch(err){UI.msg='Fayl oxunmadı: düzgün CRM JSON faylı seçin.';render()}};r.readAsText(f)}
function act(a,t,e){var id=t.dataset.id,v=t.dataset.v;var re=true;var DEL=/^(deltask|dellog|delfin|delproj|delord|delsec|tooldel|dellink|recdel|subdel|delsub|delcour)$/.test(a);if(DEL)UNDO=JSON.stringify(S);
  switch(a){
  case 'tab':UI.tab=v;UI.pid=null;UI.edit=null;window.scrollTo(0,0);break;
  case 'open':UI.pid=id;UI.ptab='tasks';UI.tab='projects';window.scrollTo(0,0);break;
  case 'back':UI.pid=null;break;
  case 'ptab':UI.ptab=v;break;
  case 'toggle':toggleTask(id);break;
  case 'up':moveTask(id,-1);break;
  case 'down':moveTask(id,1);break;
  case 'edit':UI.edit=id;break;
  case 'canceledit':UI.edit=null;break;
  case 'saveedit':var tk=S.tasks.filter(function(x){return x.id===id})[0];if(tk){tk.title=val('ed-title').trim()||tk.title;tk.phase=val('ed-phase').trim();tk.due=val('ed-due');tk.prio=+val('ed-prio');tk.repeat=val('ed-rep');tk.note=val('ed-note');save()}UI.edit=null;break;
  case 'deltask':if(ask('t'+id)){S.tasks=S.tasks.filter(function(x){return x.id!==id});save()}break;
  case 'addtoday':addTask(id,val('nt-'+id));UI.focus='nt-'+id;break;
  case 'addproj':addTask(id,val('nt-'+id),{phase:val('nt-ph').trim(),due:val('nt-due'),prio:+val('nt-prio')||2,repeat:val('nt-rep')});UI.focus='nt-'+id;break;
  case 'addlog':addLog(id,val('lg-'+id),val('lm-'+id));UI.focus='lg-'+id;break;
  case 'dellog':S.logs=S.logs.filter(function(x){return x.id!==id});save();break;
  case 'addfin':var ok1=addFin(id,'in',val('fi-'+id),val('fn-'+id)),ok2=addFin(id,'out',val('fo-'+id),val('fn-'+id));if(ok1||ok2)UI.focus='fi-'+id;break;
  case 'addfin2':var pid=id||val('ff-p'),cu=val('ff-u')||'AZN',am=num(val('ff-a')),nt=val('ff-n');if(cu!=='AZN'){nt=(nt+' ['+am+' '+cu+']').trim();am=Math.round(am*rate(cu)*100)/100}
    if(pid&&addFin(pid,val('ff-t'),am,nt,val('ff-d')||today())){S.fin[S.fin.length-1].cat=val('ff-c');save();UI.focus='ff-a'}break;
  case 'delfin':S.fin=S.fin.filter(function(x){return x.id!==id});save();break;
  case 'addsec':P(id).sections.push({title:'Yeni bölmə',body:''});save();break;
  case 'delsec':if(ask('sec'+id+t.dataset.i)){P(id).sections.splice(+t.dataset.i,1);save()}break;
  case 'addlink':var u=val('lk-u').trim();if(u){P(id).links.push({label:val('lk-l').trim(),url:u});save()}break;
  case 'dellink':P(id).links.splice(+t.dataset.i,1);save();break;
  case 'tooladd':var nm=val('tl-n').trim();if(nm){P(id).tools.push({id:uid(),name:nm,cost:num(val('tl-c')),since:today(),active:true,until:''});save()}break;
  case 'subadd':var sp=val('fs-p'),sn=val('fs-n').trim(),sc2=num(val('fs-c'));if(sp&&P(sp)&&sn&&sc2>0){P(sp).tools.push({id:uid(),name:sn,cost:sc2,since:val('fs-d')||today(),active:true,until:''});save()}break;
  case 'tooltog':P(id).tools.forEach(function(x){if(x.id===t.dataset.t){x.active=!x.active;x.until=x.active?'':today()}});save();break;
  case 'tooldel':P(id).tools=P(id).tools.filter(function(x){return x.id!==t.dataset.t});save();break;
  case 'color':P(id).color=v;save();break;
  case 'archproj':P(id).archived=!P(id).archived;save();UI.pid=null;break;
  case 'delproj':if(ask('dp'+id)){S.projects=S.projects.filter(function(x){return x.id!==id});S.tasks=S.tasks.filter(function(x){return x.pid!==id});S.logs=S.logs.filter(function(x){return x.pid!==id});S.fin=S.fin.filter(function(x){return x.pid!==id});S.done=S.done.filter(function(x){return x.pid!==id});save();UI.pid=null}break;
  case 'newProject':newProject();break;
  case 'period':UI.period=v;break;
  case 'applyrec':sortedProjects(true).filter(function(p){return !p.archived}).sort(function(a,b){return score(b)-score(a)}).forEach(function(p,i){p.order=i+1});save();break;
  case 'pup':case 'pdown':var l=sortedProjects(true).filter(function(p){return !p.archived});var i=l.map(function(p){return p.id}).indexOf(id);var j=i+(a==='pup'?-1:1);if(j>=0&&j<l.length){var o=l[i].order;l[i].order=l[j].order;l[j].order=o;save()}break;
  case 'settings':UI.modal=true;UI.msg='';break;
  case 'aitask':if(S.apiMode){delegateTask(id);re=false}else{var tq=S.tasks.filter(function(x){return x.id===id})[0];if(tq){tq.q=!tq.q;save()}}break;
  case 'apitog':S.apiMode=!S.apiMode;save();break;
  case 'advice':runAdvice();re=false;break;
  case 'aiask':runAsk();re=false;break;
  case 'autotog':S.autoAdvice=!S.autoAdvice;save();break;
  case 'undo':if(UNDO){S=norm(JSON.parse(UNDO));save()}UI.undoOn=false;break;
  case 'unlock':pinHash(val('pin-i')).then(function(h){if(h===lsGet('crm_pin')){LOCK=false;UI.pinErr=false;try{sessionStorage.setItem('crm_unl','1')}catch(x){}}else UI.pinErr=true;render()});re=false;break;
  case 'setpin':var pn=val('pin-n').trim();if(/^\d{4,8}$/.test(pn)){pinHash(pn).then(function(h){lsSet('crm_pin',h);try{sessionStorage.setItem('crm_unl','1')}catch(x){}UI.msg='PIN quruldu.';render()});re=false}else UI.msg='PIN 4–8 rəqəm olmalıdır.';break;
  case 'rmpin':lsSet('crm_pin','');UI.msg='PIN silindi.';break;
  case 'theme':var nt2=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',nt2);lsSet('crm_theme',nt2);break;
  case 'saverates':S.rates={USD:num(val('rt-usd'))||1.7,EUR:num(val('rt-eur'))||1.85};save();UI.msg='Məzənnə saxlanıldı.';break;
  case 'claudetog':S.claudeOn=!S.claudeOn;save();break;
  case 'tmstart':if(val('tm-p')){S.timer={pid:val('tm-p'),start:Date.now()};save()}break;
  case 'tmstop':if(S.timer){var mm=Math.max(1,Math.round((Date.now()-S.timer.start)/60000));addLog(S.timer.pid,val('tm-t').trim()||'Taymer ilə iş',mm);S.timer=null;save()}break;
  case 'subadd2':var ts2=S.tasks.filter(function(x){return x.id===id})[0],tx=val('sa-'+id).trim();if(ts2&&tx){ts2.sub=ts2.sub||[];ts2.sub.push({t:tx,d:false});save();UI.focus='sa-'+id}break;
  case 'subtog':var ts3=S.tasks.filter(function(x){return x.id===id})[0];if(ts3&&ts3.sub[+t.dataset.i]){ts3.sub[+t.dataset.i].d=!ts3.sub[+t.dataset.i].d;save()}break;
  case 'subdel':var ts4=S.tasks.filter(function(x){return x.id===id})[0];if(ts4){ts4.sub.splice(+t.dataset.i,1);save()}break;
  case 'recadd':var rn=val('rc-n').trim(),ra=num(val('rc-a'));if(rn&&ra>0&&val('rc-p')){S.rec=S.rec||[];S.rec.push({id:uid(),pid:val('rc-p'),note:rn,amount:ra,day:Math.min(28,Math.max(1,Math.round(num(val('rc-d')))||1)),cat:'',last:''});applyRec();save()}break;
  case 'recdel':S.rec=(S.rec||[]).filter(function(x){return x.id!==id});save();break;
  case 'ostat':UI.ostat=v;break;
  case 'addord':addOrder();break;
  case 'addpay':addPay(id);break;
  case 'delord':if(ask('o'+id)){S.orders=S.orders.filter(function(x){return x.id!==id});S.fin=S.fin.filter(function(x){return x.oid!==id});save()}break;
  case 'otab':UI.otab=v;break;
  case 'addextra':addExtra();break;
  case 'addsub':addSub();break;
  case 'subpay':subPay(id);break;
  case 'subtog2':var sx=subOf(id);if(sx){sx.active=!sx.active;sx.until=sx.active?'':today();save()}break;
  case 'delsub':if(ask('sb'+id)){S.subs=S.subs.filter(function(x){return x.id!==id});save()}break;
  case 'addcour':addCour();break;
  case 'delcour':if(ask('cr'+id)){S.courier=S.courier.filter(function(x){return x.id!==id});S.fin=S.fin.filter(function(x){return x.cid!==id});save()}break;
  case 'csv':doCsv();re=false;break;
  default:if(xact(a,t,e)===false)re=false;break;
  case 'repdays':UI.rd=+v;UI.report=buildReport();break;
  case 'report':UI.report=buildReport();UI.modal='report';UI.msg='';break;
  case 'copyreport':copyReport();re=false;break;
  case 'closemodal':UI.modal=false;break;
  case 'sbsave':localStorage&&lsSet(LSC,JSON.stringify({url:val('sb-url').trim(),key:val('sb-key').trim()}));sbStart();break;
  case 'sbreset':lsSet(LSC,'{}');sb=null;session=null;syncState='local';break;
  case 'sblogin':case 'sbsignup':authDo(a==='sbsignup');re=false;break;
  case 'sbsync':pull().then(function(){render()});re=false;break;
  case 'sblogout':sb.auth.signOut().then(function(){session=null;syncState='nologin';render()});re=false;break;
  case 'export':doExport();re=false;break;
  case 'copyjson':try{navigator.clipboard.writeText(JSON.stringify(S,null,1)).then(function(){UI.msg='Kopyalandı. Mətn faylına yapışdırıb .json kimi saxlaya bilərsiniz.';render()},function(){UI.msg='Kopyalamaq mümkün olmadı.';render()})}catch(x){UI.msg='Kopyalamaq mümkün olmadı.';render()}re=false;break;
  }
  if(DEL&&JSON.stringify(S)!==UNDO){UI.undoOn=true;clearTimeout(UI.undoT);UI.undoT=setTimeout(function(){UI.undoOn=false;render()},12000)}
  if(re)render()}
async function authDo(signup){var em=val('sb-mail').trim(),pw=val('sb-pass');UI.msg='';
  try{var r=signup?await sb.auth.signUp({email:em,password:pw}):await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error)throw r.error;session=r.data.session;if(!session){UI.msg='Hesab yaradıldı. Email təsdiqi tələb olunarsa, təsdiqləyib giriş edin.'}else{await pull()}}
  catch(e){UI.msg=e.message||'Giriş alınmadı'}
  render()}
function doExport(){var b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='crm-ehtiyat-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();lsSet('crm_last_bk',today());render()}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
var th=lsGet('crm_theme');if(th)document.documentElement.setAttribute('data-theme',th);
applyRec();render();sbStart();
setInterval(function(){var e=el('tmr');if(e&&S.timer)e.textContent=tfmt(Date.now()-S.timer.start)},15000);
})();
</script>
</body></html>
