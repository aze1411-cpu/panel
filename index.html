<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:dark}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}</style><title>Mənim CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: sol menyu (masaüstü) / alt menyu (telefon); mərkəzdə iş sahəsi. Ton: soyuq slate neytrallar + göy vurğu, hər layihənin öz rəngi. */
:root{
  --bg:#0b0e17; --surface:#121726; --surface2:#171d30; --fg:#e6e9f5; --muted:#8e98b5; --line:#232a42;
  --accent:#5ee7ff; --accent-fg:#06121a; --accent-soft:rgba(94,231,255,.13);
  --good:#4df0a8; --bad:#ff7a93; --warn:#ffc766; --good-soft:rgba(77,240,168,.13); --bad-soft:rgba(255,122,147,.14); --warn-soft:rgba(255,199,102,.14);
  --glow:rgba(94,231,255,.35); --shadow:0 0 0 1px rgba(255,255,255,.02),0 8px 24px rgba(0,0,0,.35);
  --bg-a:rgba(94,231,255,.07); --bg-b:rgba(167,139,250,.08);
  --f-display:'Space Grotesk','Inter',system-ui,sans-serif; --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; color-scheme:dark}
:root[data-theme="light"]{
  --bg:#eef1fb; --surface:#ffffff; --surface2:#f4f6fd; --fg:#161a2e; --muted:#5f6a8a; --line:#dde2f3;
  --accent:#5a3df0; --accent-fg:#ffffff; --accent-soft:rgba(90,61,240,.10);
  --good:#0b8f60; --bad:#d6335a; --warn:#a96a00; --good-soft:rgba(11,143,96,.12); --bad-soft:rgba(214,51,90,.10); --warn-soft:rgba(169,106,0,.12);
  --glow:rgba(90,61,240,.28); --shadow:0 1px 2px rgba(30,40,90,.06),0 6px 20px rgba(30,40,90,.06);
  --bg-a:rgba(90,61,240,.06); --bg-b:rgba(0,180,220,.06);
  color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--bg);background-image:radial-gradient(900px 500px at 85% -10%,var(--bg-a),transparent 60%),radial-gradient(700px 500px at -10% 40%,var(--bg-b),transparent 60%);background-attachment:fixed;color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px} .right{text-align:right}
.good{color:var(--good)} .bad{color:var(--bad)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0;max-width:980px;margin:0 auto}
.hdr h1{font-size:20px;flex:1;min-width:0}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--good);border-color:var(--good)} .pill.err{color:var(--bad);border-color:var(--bad)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;line-height:1}
main{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-bottom:24px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px;border-radius:10px;font-size:12px;color:var(--muted);font-weight:500}
nav.tabs button.on{color:var(--accent);background:var(--accent-soft)}
@media(min-width:900px){
  body{padding-left:calc(200px + 24px);padding-block:0 40px}
  .hdr,main{margin-left:0}
  nav.tabs{top:0;right:auto;bottom:0;width:184px;flex-direction:column;gap:4px;border-top:0;border-right:1px solid var(--line);padding:calc(70px + env(safe-area-inset-top,0px)) 12px 12px}
  nav.tabs button{flex:none;text-align:left;padding:10px 12px;font-size:14px}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:20px;margin-top:2px}
.stat span{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],input[type=url],select,textarea{
  width:100%;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
textarea{resize:vertical;line-height:1.5;min-height:44px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-weight:500;white-space:nowrap}
.btn.p{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.ghost{background:none}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.pc{border-left:4px solid var(--pc,var(--accent))}
.pc header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pc,var(--accent));flex:none}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--pc,var(--accent))}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);background:none;flex:none;margin-top:1px;padding:0;color:var(--accent-fg);font-size:14px;line-height:1}
.chk.on{background:var(--good);border-color:var(--good)}
.task .t{flex:1;min-width:0}
.task .t b{font-weight:500;overflow-wrap:anywhere}
.task.dn .t b{text-decoration:line-through;color:var(--muted)}
.chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);margin-right:4px}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.tact{display:flex;gap:2px;flex:none}
.tact button{border:0;background:none;color:var(--muted);padding:4px 6px;border-radius:6px}
.tact button:hover{background:var(--surface2)}
.addrow{display:flex;gap:8px;margin-top:8px}
.sub{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.sub button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;white-space:nowrap;font-size:13.5px}
.sub button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.phase{font-family:var(--f-display);font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 2px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right}
tr.zero td{color:var(--muted)}
details>summary{cursor:pointer}
.item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .d{width:78px;flex:none;color:var(--muted);font-size:12.5px;padding-top:2px}
.item .b{flex:1;min-width:0;overflow-wrap:anywhere}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}
.swatches button.on{border-color:var(--fg)}
.modalbg{position:fixed;inset:0;z-index:50;background:rgba(10,14,24,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 24px}
.modal{background:var(--surface);border-radius:16px;border:1px solid var(--line);max-width:560px;width:100%;padding:18px;display:flex;flex-direction:column;gap:14px;margin-top:20px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.sec textarea{min-height:90px}
.score{font-family:var(--f-display);font-size:22px}
svg text{fill:var(--muted);font-size:10px}
.ci{fill:var(--good)} .co{fill:var(--bad)}

.card{border-radius:16px}
.pc{border-left:0;position:relative;box-shadow:var(--shadow),inset 3px 0 0 var(--pc,var(--accent))}
.pc::after{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--pc,var(--accent));filter:blur(7px);opacity:.7;pointer-events:none}
.btn.p{box-shadow:0 0 18px -4px var(--glow);font-weight:600}
nav.tabs{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px)}
nav.tabs button.on{box-shadow:inset 0 0 0 1px var(--accent),0 0 16px -6px var(--glow)}
.sub button.on{box-shadow:0 0 16px -4px var(--glow)}
.chk.on{box-shadow:0 0 10px var(--good)}
.bar i{box-shadow:0 0 8px var(--pc,var(--accent))}
.dot{box-shadow:0 0 8px var(--pc,var(--accent))}
.stat{border-radius:14px}
.stat b{letter-spacing:-.02em}
.pill.ok{box-shadow:0 0 12px -4px var(--good)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
h2{letter-spacing:-.015em}
@media (prefers-reduced-motion:no-preference){.btn,.chk,.sub button,nav.tabs button{transition:background .15s,box-shadow .15s,border-color .15s}}
</style>
</head><body>
<div id="app"></div>
<div id="modal" hidden></div>
<script>
(function(){
'use strict';
/* Supabase (istəyə bağlı): burada doldursanız, hər cihazda yalnız email+parol yazmaq kifayət edir. */
var CONFIG={SUPABASE_URL:'https://kwjgvycrwhnhzlfvutqg.supabase.co',SUPABASE_ANON_KEY:'sb_publishable_QV9-jkwjOI17HY7jrKbl4w_lh6FMoax'};
var EMBEDDED_SEED=null; /*SEED*/
var LS='crm_state_v1',LSC='crm_sb_cfg_v1';
var MONTHS=['Yanvar','Fevral','Mart','Aprel','May','İyun','İyul','Avqust','Sentyabr','Oktyabr','Noyabr','Dekabr'];
var DAYS=['Bazar','Bazar ertəsi','Çərşənbə axşamı','Çərşənbə','Cümə axşamı','Cümə','Şənbə'];
var COLORS=['#4d8dff','#2ee6c5','#ffb54d','#ff6b81','#a78bfa','#7dff7a','#ff5fa8','#8b9ab8'];
var STATUSES=['Planlaşdırma','İşləyir','Dayandırılıb','Tamamlanıb'];
var PRIOS={1:'Yüksək',2:'Orta',3:'Aşağı'};

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function pad(n){return (n<10?'0':'')+n}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ds(new Date())}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d)}
function diffDays(a,b){return Math.round((Date.UTC.apply(null,b.split('-').map(function(x,i){return i==1?x-1:+x}))-Date.UTC.apply(null,a.split('-').map(function(x,i){return i==1?x-1:+x})))/864e5)}
function human(s){var d=pd(s);return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()}
function short(s){var d=pd(s);return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)}
function num(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(n)?0:n}
function money(n){n=Math.round(n*100)/100;var neg=n<0;var p=Math.abs(n).toFixed(2).split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');return (neg?'−':'')+p[0]+','+p[1]+' ₼'}
function el(id){return document.getElementById(id)}

/* ---------- state ---------- */
function empty(){return {v:1,updatedAt:0,projects:[],tasks:[],logs:[],fin:[],done:[],note:''}}
function norm(s){var e=empty();for(var k in e){if(s[k]===undefined)s[k]=e[k]}
  ['projects','tasks','logs','fin','done'].forEach(function(k){if(!Array.isArray(s[k]))s[k]=[]});
  s.projects.forEach(function(p,i){p.sections=p.sections||[];p.links=p.links||[];p.tools=p.tools||[];p.sc=p.sc||{};if(p.order==null)p.order=i+1;p.status=p.status||'Planlaşdırma';p.color=p.color||COLORS[i%COLORS.length]});
  return s}
function load(){var raw=lsGet(LS);if(raw){try{return norm(JSON.parse(raw))}catch(e){}}
  if(EMBEDDED_SEED){return norm(JSON.parse(JSON.stringify(EMBEDDED_SEED)))}
  return empty()}
var S=load();
var UI={tab:'today',pid:null,ptab:'tasks',period:'30',from:'',to:'',edit:null,focus:null,archPid:'',archQ:'',archT:'',confirm:null,modal:null,msg:''};
var saveT=null;
function save(){S.updatedAt=Date.now();lsSet(LS,JSON.stringify(S));schedulePush()}
function saveQuiet(){clearTimeout(saveT);saveT=setTimeout(save,500)}

/* ---------- data helpers ---------- */
function P(id){return S.projects.filter(function(p){return p.id===id})[0]}
function sortedProjects(all){return S.projects.filter(function(p){return all||(!p.archived&&(p.status==='Planlaşdırma'||p.status==='İşləyir'))}).sort(function(a,b){return a.order-b.order})}
function tasksOf(pid){return S.tasks.filter(function(t){return t.pid===pid}).sort(function(a,b){return a.order-b.order})}
function isDone(t){return t.repeat?t.doneOn===today():!!t.done}
function pname(pid){var p=P(pid);return p?p.name:'—'}
function pcolor(pid){var p=P(pid);return p?p.color:'#64748b'}
function inRange(d,f,t){return d>=f&&d<=t}
function finSum(f,t,pid){var i=0,o=0;S.fin.forEach(function(e){if(pid&&e.pid!==pid)return;if(!inRange(e.date,f,t))return;if(e.type==='in')i+=e.amount;else o+=e.amount});return {i:i,o:o}}
function toolCost(p,f,t){var c=0;p.tools.forEach(function(x){var st=x.since||today();var s=st>f?st:f;var en=x.active?t:(x.until||t);if(en>t)en=t;if(en<s)return;c+=x.cost*12/365*(diffDays(s,en)+1)});return c}
function toolCostAll(f,t,pid){var c=0;S.projects.forEach(function(p){if(!pid||p.id===pid)c+=toolCost(p,f,t)});return c}
function minDate(){var m=today();S.fin.forEach(function(e){if(e.date<m)m=e.date});S.projects.forEach(function(p){p.tools.forEach(function(x){if(x.since&&x.since<m)m=x.since})});return m}
function period(){var t=today(),p=UI.period;
  if(p==='today')return [t,t];if(p==='7')return [addDays(t,-6),t];if(p==='30')return [addDays(t,-29),t];
  if(p==='month')return [t.slice(0,8)+'01',t];if(p==='custom')return [UI.from||t,UI.to||t];return [minDate(),t]}
function costScore(b){if(b===''||b==null||isNaN(+b))return 3;b=+b;return b<=100?5:b<=300?4:b<=1000?3:b<=3000?2:1}
function score(p){var s=p.sc||{};var pot=+s.pot||3,sp=+s.spd||3,rk=+s.rsk||3,h=+s.rdy||0;return Math.round((3*pot+2*sp+2*(6-rk)+2*costScore(s.bud)+h/20)*2)}
function progress(pid){var ts=tasksOf(pid).filter(function(t){return !t.repeat});var d=ts.filter(function(t){return t.done}).length;return {d:d,n:ts.length}}
function minutes(pid){var m=0;S.logs.forEach(function(l){if(!pid||l.pid===pid)m+=l.min||0});return m}

/* ---------- actions ---------- */
function addTask(pid,title,o){title=(title||'').trim();if(!title)return;o=o||{};
  var mx=0;tasksOf(pid).forEach(function(t){if(t.order>mx)mx=t.order});
  S.tasks.push({id:uid(),pid:pid,title:title,note:o.note||'',phase:o.phase||'',prio:o.prio||2,due:o.due||'',repeat:o.repeat||'',done:false,doneOn:'',mine:true,order:mx+1,ts:Date.now()});save()}
function toggleTask(id){var t=S.tasks.filter(function(x){return x.id===id})[0];if(!t)return;var td=today();
  if(t.repeat){if(t.doneOn===td){t.doneOn='';rmDone(id,td)}else{t.doneOn=td;S.done.push({id:uid(),date:td,pid:t.pid,taskId:id,title:t.title,ts:Date.now()})}}
  else if(t.done){t.done=false;t.doneAt='';rmDone(id,null)}
  else{t.done=true;t.doneAt=td;S.done.push({id:uid(),date:td,pid:t.pid,taskId:id,title:t.title,ts:Date.now()})}
  save()}
function rmDone(taskId,date){for(var i=S.done.length-1;i>=0;i--){if(S.done[i].taskId===taskId&&(!date||S.done[i].date===date)){S.done.splice(i,1);break}}}
function moveTask(id,dir){var t=S.tasks.filter(function(x){return x.id===id})[0];var l=tasksOf(t.pid);var i=l.indexOf(t);var j=i+dir;if(j<0||j>=l.length)return;var a=l[i].order;l[i].order=l[j].order;l[j].order=a;save()}
function addLog(pid,text,min){text=(text||'').trim();if(!text)return;S.logs.push({id:uid(),date:today(),pid:pid,text:text,min:Math.round(num(min)),ts:Date.now()});save()}
function addFin(pid,type,amount,note,date){amount=num(amount);if(!(amount>0))return false;S.fin.push({id:uid(),date:date||today(),pid:pid,type:type,amount:amount,note:(note||'').trim(),ts:Date.now()});save();return true}
function newProject(){var n=S.projects.length;var p={id:uid(),name:'Yeni layihə',type:'',status:'Planlaşdırma',color:COLORS[n%COLORS.length],summary:'',start:today(),order:n+1,sc:{pot:3,spd:3,rsk:3,bud:'',rdy:0},sections:[],links:[],tools:[],archived:false};S.projects.push(p);save();UI.pid=p.id;UI.tab='projects';UI.ptab='notes'}
function ask(key){if(UI.confirm===key){UI.confirm=null;return true}UI.confirm=key;return false}

/* ---------- render ---------- */
var TABS=[['today','Bu gün'],['projects','Layihələr'],['finance','Maliyyə'],['strategy','Strategiya'],['archive','Arxiv']];
function render(){
  var sy=window.scrollY;var app=el('app');
  var h='<div class="hdr"><h1>Mənim CRM</h1>'+syncPill()+'<button class="iconbtn" data-act="settings" aria-label="Ayarlar">⚙</button></div>';
  h+='<main>'+view()+'</main>';
  h+='<nav class="tabs">'+TABS.map(function(t){return '<button data-act="tab" data-v="'+t[0]+'" class="'+(UI.tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'</nav>';
  app.innerHTML=h;
  document.querySelectorAll('textarea.auto').forEach(autosize);
  var m=el('modal');if(UI.modal){m.hidden=false;m.innerHTML=modalView()}else{m.hidden=true;m.innerHTML=''}
  window.scrollTo(0,sy);
  if(UI.focus){var f=el(UI.focus);if(f)f.focus();UI.focus=null}
}
function autosize(t){t.style.height='auto';t.style.height=Math.max(t.scrollHeight+2,44)+'px'}
function view(){
  if(!S.projects.length&&UI.tab!=='archive')return welcome();
  if(UI.tab==='today')return todayView();
  if(UI.tab==='projects')return UI.pid&&P(UI.pid)?projectView(P(UI.pid)):projectList();
  if(UI.tab==='finance')return financeView();
  if(UI.tab==='strategy')return strategyView();
  return archiveView()}

function clip(s,n){s=String(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n-1)+'…':s}
function hm(m){return m?Math.floor(m/60)+' saat '+(m%60)+' dəq':'0'}
function buildReport(){
  var t=today(),f=addDays(t,-6),L=[];
  function inR(d){return !!d&&d>=f&&d<=t}
  var tot=finSum(f,t),tc=toolCostAll(f,t),allMin=0;
  S.logs.forEach(function(l){if(inR(l.date))allMin+=l.min||0});
  L.push('CRM HESABATI · son 7 gün ('+human(f)+' – '+human(t)+')');
  L.push('Ümumi: gəlir '+money(tot.i)+', xərc '+money(tot.o)+', abunə '+money(tc)+', xalis '+money(tot.i-tot.o-tc)+', iş vaxtı '+hm(allMin));
  var ps=sortedProjects(true).filter(function(p){return !p.archived}),stuck=[];
  L.push('');L.push('LAYİHƏLƏR ÜZRƏ');
  ps.forEach(function(p){
    var pr=progress(p.id);
    var done=S.done.filter(function(d){return d.pid===p.id&&inR(d.date)});
    var logs=S.logs.filter(function(l){return l.pid===p.id&&inR(l.date)}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)});
    var fins=S.fin.filter(function(e){return e.pid===p.id&&inR(e.date)}).sort(function(a,b){return a.date<b.date?-1:1});
    var x=finSum(f,t,p.id),c=toolCost(p,f,t);
    var open=tasksOf(p.id).filter(function(k){return !isDone(k)});
    var once=open.filter(function(k){return !k.repeat}),daily=open.filter(function(k){return k.repeat});
    L.push('');
    L.push('■ '+p.name+' ['+p.status+'] · '+pr.d+'/'+pr.n+' tapşırıq tamamdır');
    if(p.summary)L.push('  Təsvir: '+clip(p.summary,140));
    var cnt={},order=[];done.forEach(function(d){if(!cnt[d.title]){cnt[d.title]=0;order.push(d.title)}cnt[d.title]++});
    L.push('  Görülənlər:'+((order.length||logs.length)?'':' yoxdur'));
    order.forEach(function(k){L.push('   ✓ '+clip(k,90)+(cnt[k]>1?' ×'+cnt[k]:''))});
    logs.forEach(function(l){L.push('   • '+short(l.date)+': '+clip(l.text,110)+(l.min?' ('+l.min+' dəq)':''))});
    L.push('  Pul: gəlir '+money(x.i)+', xərc '+money(x.o)+(c?', abunə '+money(c):''));
    fins.slice(0,5).forEach(function(e){L.push('   '+(e.type==='in'?'+':'−')+money(e.amount)+(e.note?' · '+clip(e.note,60):''))});
    if(fins.length>5)L.push('   … daha '+(fins.length-5)+' hərəkət');
    L.push('  Açıq tapşırıqlar ('+once.length+'):'+(once.length?'':' yoxdur'));
    once.slice(0,8).forEach(function(k){var m='';if(k.prio===1)m+=' [yüksək]';if(k.due)m+=' [son tarix '+short(k.due)+(k.due<t?', gecikib':'')+']';L.push('   ○ '+clip(k.title,90)+m)});
    if(once.length>8)L.push('   … daha '+(once.length-8)+' tapşırıq');
    if(daily.length)L.push('  Gündəlik: '+daily.map(function(k){return clip(k.title,40)}).join('; '));
    once.forEach(function(k){
      if(k.due&&k.due<t)stuck.push(p.name+': “'+clip(k.title,70)+'” '+diffDays(k.due,t)+' gün gecikib');
      else if(k.prio===1&&k.ts&&k.ts<Date.now()-7*864e5)stuck.push(p.name+': “'+clip(k.title,70)+'” yüksək prioritetlidir, 7+ gündür açıqdır');
    });
    if((p.status==='İşləyir'||p.status==='Planlaşdırma')&&!done.length&&!logs.length&&!fins.length&&once.length)
      stuck.push(p.name+': son 7 gündə heç bir hərəkət yoxdur ('+once.length+' açıq tapşırıq)');
  });
  L.push('');L.push('İLİŞƏN İŞLƏR');
  if(stuck.length)stuck.forEach(function(s){L.push('! '+s)});else L.push('Görünən ilişən iş yoxdur.');
  if(S.note&&S.note.trim()){L.push('');L.push('Strategiya qeydi: '+clip(S.note,300))}
  return L.join('\n')}

  switch(a){

  case 'edit':UI.edit=id;break;
  case 'canceledit':UI.edit=null;break;
  case 'saveedit':var tk=S.tasks.filter(function(x){return x.id===id})[0];if(tk){tk.title=val('ed-title').trim()||tk.title;tk.phase=val('ed-phase').trim();tk.due=val('ed-due');tk.prio=+val('ed-prio');tk.repeat=val('ed-rep');tk.note=val('ed-note');save()}UI.edit=null;break;
  case 'deltask':if(ask('t'+id)){S.tasks=S.tasks.filter(function(x){return x.id!==id});save()}break;
  case 'addtoday':addTask(id,val('nt-'+id));UI.focus='nt-'+id;break;
  case 'addproj':addTask(id,val('nt-'+id),{phase:val('nt-ph').trim(),due:val('nt-due'),prio:+val('nt-prio')||2,repeat:val('nt-rep')});UI.focus='nt-'+id;break;
  case 'addlog':addLog(id,val('lg-'+id),val('lm-'+id));UI.focus='lg-'+id;break;
  case 'dellog':S.logs=S.logs.filter(function(x){return x.id!==id});save();break;
  case 'addfin':var ok1=addFin(id,'in',val('fi-'+id),val('fn-'+id)),ok2=addFin(id,'out',val('fo-'+id),val('fn-'+id));if(ok1||ok2)UI.focus='fi-'+id;break;
  case 'addfin2':var pid=id||val('ff-p');if(pid&&addFin(pid,val('ff-t'),val('ff-a'),val('ff-n'),val('ff-d')||today()))UI.focus='ff-a';break;
  case 'delfin':S.fin=S.fin.filter(function(x){return x.id!==id});save();break;
  case 'addsec':P(id).sections.push({title:'Yeni bölmə',body:''});save();break;
  case 'delsec':if(ask('sec'+id+t.dataset.i)){P(id).sections.splice(+t.dataset.i,1);save()}break;
  case 'addlink':var u=val('lk-u').trim();if(u){P(id).links.push({label:val('lk-l').trim(),url:u});save()}break;
  case 'dellink':P(id).links.splice(+t.dataset.i,1);save();break;
  case 'tooladd':var nm=val('tl-n').trim();if(nm){P(id).tools.push({id:uid(),name:nm,cost:num(val('tl-c')),since:today(),active:true,until:''});save()}break;
  case 'tooltog':P(id).tools.forEach(function(x){if(x.id===t.dataset.t){x.active=!x.active;x.until=x.active?'':today()}});save();break;
  case 'tooldel':P(id).tools=P(id).tools.filter(function(x){return x.id!==t.dataset.t});save();break;
  case 'color':P(id).color=v;save();break;
  case 'archproj':P(id).archived=!P(id).archived;save();UI.pid=null;break;
  case 'delproj':if(ask('dp'+id)){S.projects=S.projects.filter(function(x){return x.id!==id});S.tasks=S.tasks.filter(function(x){return x.pid!==id});S.logs=S.logs.filter(function(x){return x.pid!==id});S.fin=S.fin.filter(function(x){return x.pid!==id});S.done=S.done.filter(function(x){return x.pid!==id});save();UI.pid=null}break;
  case 'newProject':newProject();break;
  case 'period':UI.period=v;break;
  case 'applyrec':sortedProjects(true).filter(function(p){return !p.archived}).sort(function(a,b){return score(b)-score(a)}).forEach(function(p,i){p.order=i+1});save();break;
  case 'pup':case 'pdown':var l=sortedProjects(true).filter(function(p){return !p.archived});var i=l.map(function(p){return p.id}).indexOf(id);var j=i+(a==='pup'?-1:1);if(j>=0&&j<l.length){var o=l[i].order;l[i].order=l[j].order;l[j].order=o;save()}break;
 case 'settings':UI.modal=true;UI.msg='';break;
  case 'report':UI.report=buildReport();UI.modal='report';UI.msg='';break;
  case 'copyreport':copyReport();re=false;break;
  case 'closemodal':UI.modal=false;break;
  case 'sbsave':localStorage&&lsSet(LSC,JSON.stringify({url:val('sb-url').trim(),key:val('sb-key').trim()}));sbStart();break;
  case 'sbreset':lsSet(LSC,'{}');sb=null;session=null;syncState='local';break;
  case 'sblogin':case 'sbsignup':authDo(a==='sbsignup');re=false;break;
  case 'sbsync':pull().then(function(){render()});re=false;break;
  case 'sblogout':sb.auth.signOut().then(function(){session=null;syncState='nologin';render()});re=false;break;
  case 'export':doExport();re=false;break;
  case 'copyjson':try{navigator.clipboard.writeText(JSON.stringify(S,null,1)).then(function(){UI.msg='Kopyalandı. Mətn faylına yapışdırıb .json kimi saxlaya bilərsiniz.';render()},function(){UI.msg='Kopyalamaq mümkün olmadı.';render()})}catch(x){UI.msg='Kopyalamaq mümkün olmadı.';render()}re=false;break;
  }
  if(re)render()}
async function authDo(signup){var em=val('sb-mail').trim(),pw=val('sb-pass');UI.msg='';
  try{var r=signup?await sb.auth.signUp({email:em,password:pw}):await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error)throw r.error;session=r.data.session;if(!session){UI.msg='Hesab yaradıldı. Email təsdiqi tələb olunarsa, təsdiqləyib giriş edin.'}else{await pull()}}
  catch(e){UI.msg=e.message||'Giriş alınmadı'}
  render()}
function doExport(){var b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='crm-ehtiyat-'+today()+'.json';document.body.appendChild(a);a.click();a.remove()}

render();sbStart();
})();
</script>
</body></html>
